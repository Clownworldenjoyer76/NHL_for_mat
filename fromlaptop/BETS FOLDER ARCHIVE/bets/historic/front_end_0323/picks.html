<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Picks</title>
<link rel="stylesheet" href="css/matstheme.css">
<style>
    .loading-pulse {
        animation: status-glow 1.5s infinite;
        font-weight: bold;
        letter-spacing: 1px;
    }

    @keyframes status-glow {
        0% { color: var(--accent-yellow); opacity: 1; }
        50% { color: var(--accent-green); opacity: 0.5; }
        100% { color: var(--accent-yellow); opacity: 1; }
    }

    #games.loading::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--accent-green);
        box-shadow: 0 0 10px var(--accent-green);
        animation: scan 2s linear infinite;
        z-index: 10;
    }

    @keyframes scan {
        0% { top: 0%; }
        100% { top: 100%; }
    }

    .pick-card {
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease, border-left 0.25s ease;
        background: rgba(15, 20, 27, 0.8) !important;
        backdrop-filter: blur(5px);
        border: 1px solid var(--border-soft);
        position: relative;
    }

    .pick-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 255, 132, 0.15);
        border-color: var(--accent-green);
        border-left: 3px solid var(--accent-green);
        background: rgba(22, 27, 34, 0.9) !important;
    }

    .filters {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .filter-pill {
        padding: 6px 16px;
        border: 1px solid var(--border-soft);
        border-radius: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        color: var(--text-muted);
        transition: all 0.2s ease;
        background: var(--bg-card);
    }

    .filter-pill.active {
        border-color: var(--accent-green);
        color: var(--accent-green);
        background: rgba(0, 255, 132, 0.05);
        box-shadow: 0 0 10px rgba(0, 255, 132, 0.2);
    }

    input[type="date"] {
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        color: var(--text-main);
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        outline: none;
    }

    input[type="date"]:focus {
        border-color: var(--accent-green);
        box-shadow: 0 0 5px rgba(0, 255, 132, 0.2);
    }

    /* FIX 8: dark theme calendar icon */
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1) opacity(0.4);
        cursor: pointer;
    }

    .modal {
        backdrop-filter: blur(8px);
        transition: opacity 0.3s ease;
    }

    .modal-card {
        border: 1px solid var(--accent-green);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .league-grid {
        position: relative;
        min-height: 200px;
    }
</style>
</head>

<body>
<div class="container">

    <h1>Picks</h1>

    <div id="nav-placeholder"></div>

    <section class="controls">
        <div class="row">
            <div>
                <label style="display:block; margin-bottom:8px; font-size:11px; color:var(--text-muted); text-transform:uppercase;">Select Date:</label>
                <input id="p-date" type="date">
            </div>
        </div>
    </section>

    <!-- FIX 4: filter pills use filterLeague(league, this) to properly
         deactivate the previous pill and match app.js column structure -->
    <div class="filters" id="league-filters">
        <div class="filter-pill active" onclick="filterLeague('all', this)">All Leagues</div>
        <div class="filter-pill" onclick="filterLeague('NHL', this)">NHL</div>
        <div class="filter-pill" onclick="filterLeague('NBA', this)">NBA</div>
        <div class="filter-pill" onclick="filterLeague('NCAAB', this)">NCAAB</div>
    </div>

    <div id="status" class="status"></div>

    <div id="games" class="league-grid"></div>

</div>

<!-- FIX 1: removed duplicate onclick="closeModal(event)" and window.onclick —
     app.js already handles backdrop click via modal.addEventListener -->
<div id="modal" class="modal">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div id="modal-content"></div>
        <button class="secondary-btn"
            style="margin-top:20px; width:100%; background:var(--accent-green); color:var(--background); border:none; padding:12px; font-weight:bold; cursor:pointer; text-transform:uppercase;"
            onclick="document.getElementById('modal').classList.remove('open')">
            Close Details
        </button>
    </div>
</div>

<!-- FIX 2: defer preserves load order (config → nav → app) without blocking render -->
<script src="js/config.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/app.js" defer></script>

<script>
    // FIX 4: filter pills — strips active from all pills before setting new one,
    // then shows/hides league columns by matching .league-header text
    function filterLeague(league, el) {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        if (el) el.classList.add('active');

        document.querySelectorAll('.league-column').forEach(col => {
            const header = col.querySelector('.league-header');
            if (!header) return;
            col.style.display = (
                league === 'all' ||
                header.textContent.trim().toUpperCase() === league.toUpperCase()
            ) ? '' : 'none';
        });
    }

    // FIX 6: expose setStatusLoading / setStatusReady globally so app.js
    // can call them to control the scan line animation
    function setStatusLoading(msg) {
        const s = document.getElementById('status');
        const g = document.getElementById('games');
        if (s) { s.textContent = msg; s.classList.add('loading-pulse'); }
        if (g) g.classList.add('loading');
    }

    function setStatusReady(msg) {
        const s = document.getElementById('status');
        const g = document.getElementById('games');
        if (s) { s.textContent = msg; s.classList.remove('loading-pulse'); }
        if (g) g.classList.remove('loading');
    }
</script>
</body>
</html>
