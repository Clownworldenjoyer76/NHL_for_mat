        odds_bands: [[-10000, 10000]]
        ev_bands: [[-1.0, 999.9999]]
        kelly_bands: [[0.0, 999.9999]]
      away:
        enabled: true
        prob_bands: [[0.0, 1.0]]
        line_bands: [[-100.0, 100.0]]
