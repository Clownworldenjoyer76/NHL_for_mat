version: "1.0"

linter: qodana-python

profile:
  name: qodana.recommended

bootstrap: |
  python -m pip install --upgrade pip
  python -m pip install -r docs/win/hockey/nhl/requirements.txt

onlyDirectory: docs/win/hockey/nhl

include:
  - name: CheckDependencyLicenses

exclude:
  - name: PyClassHasNoInit
  - name: All
    paths:
      - docs/win/hockey/nhl/00_intake/predictions/archive
