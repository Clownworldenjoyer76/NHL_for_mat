name: Test NHL Game ID Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  test-nhl-game-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Syntax check scripts
        run: |
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/transform_hockey_odds.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/transform_hockey.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/pull_nhl_schedule.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/reconcile_game_ids.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/build_games.py

      - name: Select test date
        run: |
          $base = "docs/win/hockey/nhl"

          $oddsDir = Join-Path $base "odds"
          $scraperDir = Join-Path $base "00_intake/predictions/scraper"
          $sportsbookDir = Join-Path $base "00_intake/sportsbook"

          $oddsDates = @(
              Get-ChildItem $oddsDir -File -Filter "*.json" |
              Where-Object {
                  $_.BaseName -match '^\d{4}_\d{2}_\d{2}$' -and
                  $_.Length -gt 1000
              } |
              ForEach-Object {
                  $_.BaseName
              }
          )

          $scraperDates = @(
              Get-ChildItem $scraperDir -File -Filter "*_nhl_predictions.csv" |
              ForEach-Object {
                  if ($_.Name -match '^(\d{4}_\d{2}_\d{2})_nhl_predictions\.csv$') {
                      $Matches[1]
                  }
              }
          )

          $sportsbookDates = @(
              Get-ChildItem $sportsbookDir -File -Filter "NHL_*.csv" |
              ForEach-Object {
                  if ($_.Name -match '^NHL_(\d{4}_\d{2}_\d{2})\.csv$') {
                      $Matches[1]
                  }
              }
          )

          $commonDates = @(
              $oddsDates |
              Where-Object {
                  ($scraperDates -contains $_) -and
                  ($sportsbookDates -contains $_)
              } |
              Sort-Object -Descending -Unique
          )

          if ($commonDates.Count -eq 0) {
              throw "No valid test date found."
          }

          $testDate = $commonDates[0]

          "TEST_DATE=$testDate" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "TEST DATE: $testDate"

      - name: Isolate test date
        run: |
          $base = "docs/win/hockey/nhl"

          $oddsDir = Join-Path $base "odds"
          $scraperDir = Join-Path $base "00_intake/predictions/scraper"
          $sportsbookDir = Join-Path $base "00_intake/sportsbook"
          $predictionsDir = Join-Path $base "00_intake/predictions"

          $backupDir = Join-Path $env:RUNNER_TEMP "nhl_game_id_test_backup"

          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $backupDir "odds") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $backupDir "scraper") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $backupDir "sportsbook") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $backupDir "predictions") | Out-Null

          Get-ChildItem $oddsDir -File -Filter "*.json" |
          Where-Object {
              $_.Name -ne "$env:TEST_DATE.json"
          } |
          ForEach-Object {
              Move-Item $_.FullName (Join-Path $backupDir "odds")
          }

          Get-ChildItem $scraperDir -File -Filter "*_nhl_predictions.csv" |
          Where-Object {
              $_.Name -ne "$env:TEST_DATE`_nhl_predictions.csv"
          } |
          ForEach-Object {
              Move-Item $_.FullName (Join-Path $backupDir "scraper")
          }

          Get-ChildItem $sportsbookDir -File -Filter "*.csv" |
          Where-Object {
              $_.Name -ne "NHL_$env:TEST_DATE.csv"
          } |
          ForEach-Object {
              Move-Item $_.FullName (Join-Path $backupDir "sportsbook")
          }

          Get-ChildItem $predictionsDir -File -Filter "hockey_*.csv" |
          ForEach-Object {
              Move-Item $_.FullName (Join-Path $backupDir "predictions")
          }

          $cleanDirs = @(
              (Join-Path $base "00_intake/nhl_schedule"),
              (Join-Path $base "00_intake/reconciled"),
              (Join-Path $base "00_intake/games")
          )

          foreach ($dir in $cleanDirs) {
              if (Test-Path $dir) {
                  Remove-Item $dir -Recurse -Force
              }

              New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          New-Item `
              -ItemType Directory `
              -Force `
              -Path (Join-Path $base "00_intake/reconciled/audit") |
              Out-Null

      - name: Run transform_hockey_odds.py
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/transform_hockey_odds.py

          $path = "docs/win/hockey/nhl/00_intake/sportsbook/NHL_$env:TEST_DATE.csv"

          if (-not (Test-Path $path)) {
              throw "Sportsbook output missing."
          }

          $header = Get-Content $path -First 1

          if ($header -notmatch "sportsbook_event_id") {
              throw "sportsbook_event_id missing."
          }

          if ($header -match '(^|,)game_id(,|$)') {
              throw "Sportsbook provider ID is still being emitted as game_id."
          }

      - name: Run transform_hockey.py
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/transform_hockey.py

          $path = "docs/win/hockey/nhl/00_intake/predictions/hockey_$env:TEST_DATE.csv"

          if (-not (Test-Path $path)) {
              throw "Prediction output missing."
          }

          $rows = @(Import-Csv $path)

          if ($rows.Count -eq 0) {
              throw "Prediction output contains zero rows."
          }

          foreach ($row in $rows) {
              if (-not [string]::IsNullOrWhiteSpace($row.game_id)) {
                  throw "Prediction received game_id before reconciliation."
              }
          }

      - name: Run pull_nhl_schedule.py
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_schedule.py

          $path = "docs/win/hockey/nhl/00_intake/nhl_schedule/NHL_$env:TEST_DATE.csv"

          if (-not (Test-Path $path)) {
              throw "Official NHL schedule output missing."
          }

          $rows = @(Import-Csv $path)

          if ($rows.Count -eq 0) {
              throw "Official NHL schedule contains zero rows."
          }

          foreach ($row in $rows) {
              if ([string]::IsNullOrWhiteSpace($row.game_id)) {
                  throw "Official NHL schedule contains blank game_id."
              }

              if ($row.game_id -notmatch '^\d{10}$') {
                  throw "Invalid NHL game_id: $($row.game_id)"
              }
          }

      - name: Run reconcile_game_ids.py
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/reconcile_game_ids.py

          $reconciled = "docs/win/hockey/nhl/00_intake/reconciled/NHL_$env:TEST_DATE.csv"
          $sportsbook = "docs/win/hockey/nhl/00_intake/sportsbook/NHL_$env:TEST_DATE.csv"
          $prediction = "docs/win/hockey/nhl/00_intake/predictions/hockey_$env:TEST_DATE.csv"
          $audit = "docs/win/hockey/nhl/00_intake/reconciled/audit/NHL_$env:TEST_DATE`_reconciliation.csv"

          foreach ($path in @($reconciled, $sportsbook, $prediction, $audit)) {
              if (-not (Test-Path $path)) {
                  throw "Expected reconciliation output missing: $path"
              }
          }

          $rows = @(Import-Csv $reconciled)

          if ($rows.Count -eq 0) {
              throw "Reconciliation produced zero rows."
          }

          foreach ($row in $rows) {
              if ([string]::IsNullOrWhiteSpace($row.game_id)) {
                  throw "Blank official game_id."
              }

              if ([string]::IsNullOrWhiteSpace($row.sportsbook_event_id)) {
                  throw "Blank sportsbook_event_id."
              }

              if ($row.game_id -eq $row.sportsbook_event_id) {
                  throw "Official game_id equals sportsbook_event_id."
              }
          }

          $auditRows = @(Import-Csv $audit)

          $badAudit = @(
              $auditRows |
              Where-Object {
                  $_.status -ne "reconciled"
              }
          )

          if ($badAudit.Count -gt 0) {
              $badAudit | Format-Table -AutoSize
              throw "Reconciliation audit contains failures."
          }

      - name: Run build_games.py
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/build_games.py

          $path = "docs/win/hockey/nhl/00_intake/games/$env:TEST_DATE`_nhl_games.csv"

          if (-not (Test-Path $path)) {
              throw "Games output missing."
          }

          $rows = @(Import-Csv $path)

          if ($rows.Count -eq 0) {
              throw "Games output contains zero rows."
          }

          foreach ($row in $rows) {
              if ([string]::IsNullOrWhiteSpace($row.game_id)) {
                  throw "Games output contains blank game_id."
              }

              if ([string]::IsNullOrWhiteSpace($row.sportsbook_event_id)) {
                  throw "Games output contains blank sportsbook_event_id."
              }
          }

      - name: Cross-check IDs
        run: |
          @'
          import csv
          import os
          from pathlib import Path

          date = os.environ["TEST_DATE"]
          base = Path("docs/win/hockey/nhl")

          paths = {
              "schedule": base / "00_intake" / "nhl_schedule" / f"NHL_{date}.csv",
              "sportsbook": base / "00_intake" / "sportsbook" / f"NHL_{date}.csv",
              "prediction": base / "00_intake" / "predictions" / f"hockey_{date}.csv",
              "reconciled": base / "00_intake" / "reconciled" / f"NHL_{date}.csv",
              "games": base / "00_intake" / "games" / f"{date}_nhl_games.csv",
          }

          def read_rows(path):
              with path.open("r", newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))

          data = {name: read_rows(path) for name, path in paths.items()}

          for name, rows in data.items():
              if not rows:
                  raise SystemExit(f"{name} contains zero rows.")

          schedule_ids = {row["game_id"].strip() for row in data["schedule"]}
          sportsbook_ids = {row["game_id"].strip() for row in data["sportsbook"]}
          prediction_ids = {row["game_id"].strip() for row in data["prediction"]}
          reconciled_ids = {row["game_id"].strip() for row in data["reconciled"]}
          games_ids = {row["game_id"].strip() for row in data["games"]}

          if sportsbook_ids != prediction_ids:
              raise SystemExit("Sportsbook and prediction game IDs do not match.")

          if sportsbook_ids != reconciled_ids:
              raise SystemExit("Sportsbook and reconciled game IDs do not match.")

          if sportsbook_ids != games_ids:
              raise SystemExit("Sportsbook and games game IDs do not match.")

          if not games_ids.issubset(schedule_ids):
              raise SystemExit("A pipeline game_id is absent from the official NHL schedule.")

          sportsbook_event_ids = {
              row["sportsbook_event_id"].strip()
              for row in data["sportsbook"]
          }

          if "" in sportsbook_event_ids:
              raise SystemExit("Blank sportsbook_event_id found.")

          if sportsbook_event_ids & games_ids:
              raise SystemExit(
                  "sportsbook_event_id is still being used as official game_id."
              )

          print("NHL GAME ID CROSS-CHECK PASSED")
          print(f"Test date: {date}")
          print(f"Official NHL IDs: {sorted(games_ids)}")
          print(f"Sportsbook event IDs: {sorted(sportsbook_event_ids)}")
          '@ | python -

      - name: Save permanent test outputs
        run: |
          $base = "docs/win/hockey/nhl"

          $outputDir = Join-Path `
              $base `
              "test_output/game_id_reconciliation/$env:TEST_DATE"

          if (Test-Path $outputDir) {
              Remove-Item $outputDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $outputDir "logs") | Out-Null

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/nhl_schedule/NHL_$env:TEST_DATE.csv" `
              (Join-Path $outputDir "nhl_schedule.csv")

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/sportsbook/NHL_$env:TEST_DATE.csv" `
              (Join-Path $outputDir "sportsbook_reconciled.csv")

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/predictions/hockey_$env:TEST_DATE.csv" `
              (Join-Path $outputDir "predictions_reconciled.csv")

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/reconciled/NHL_$env:TEST_DATE.csv" `
              (Join-Path $outputDir "reconciled_games.csv")

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/reconciled/audit/NHL_$env:TEST_DATE`_reconciliation.csv" `
              (Join-Path $outputDir "reconciliation_audit.csv")

          Copy-Item `
              "docs/win/hockey/nhl/00_intake/games/$env:TEST_DATE`_nhl_games.csv" `
              (Join-Path $outputDir "games.csv")

          $logFiles = @(
              "transform_hockey_odds.txt",
              "transform_hockey.txt",
              "pull_nhl_schedule.txt",
              "reconcile_game_ids.txt",
              "build_games.txt"
          )

          foreach ($name in $logFiles) {
              $source = Join-Path `
                  "docs/win/hockey/nhl/errors/00_intake" `
                  $name

              if (Test-Path $source) {
                  Copy-Item `
                      $source `
                      (Join-Path (Join-Path $outputDir "logs") $name)
              }
          }

          $schedule = @(Import-Csv (Join-Path $outputDir "nhl_schedule.csv"))
          $sportsbook = @(Import-Csv (Join-Path $outputDir "sportsbook_reconciled.csv"))
          $predictions = @(Import-Csv (Join-Path $outputDir "predictions_reconciled.csv"))
          $reconciled = @(Import-Csv (Join-Path $outputDir "reconciled_games.csv"))
          $audit = @(Import-Csv (Join-Path $outputDir "reconciliation_audit.csv"))
          $games = @(Import-Csv (Join-Path $outputDir "games.csv"))

          $officialIds = @(
              $reconciled |
              ForEach-Object { $_.game_id } |
              Sort-Object -Unique
          )

          $sportsbookIds = @(
              $reconciled |
              ForEach-Object { $_.sportsbook_event_id } |
              Sort-Object -Unique
          )

          $summary = @(
              "NHL GAME ID RECONCILIATION TEST"
              "TEST_DATE=$env:TEST_DATE"
              "STATUS=PASSED"
              ""
              "schedule_rows=$($schedule.Count)"
              "sportsbook_rows=$($sportsbook.Count)"
              "prediction_rows=$($predictions.Count)"
              "reconciled_rows=$($reconciled.Count)"
              "audit_rows=$($audit.Count)"
              "games_rows=$($games.Count)"
              ""
              "official_nhl_game_ids=$($officialIds -join ',')"
              "sportsbook_event_ids=$($sportsbookIds -join ',')"
          )

          $summary |
              Set-Content `
                  (Join-Path $outputDir "summary.txt") `
                  -Encoding utf8

          Write-Host "Saved permanent test output:"
          Write-Host $outputDir

          Get-ChildItem $outputDir -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Restore checkout before commit
        run: |
          git reset --hard HEAD

          git clean -fd `
              docs/win/hockey/nhl/00_intake/nhl_schedule `
              docs/win/hockey/nhl/00_intake/reconciled `
              docs/win/hockey/nhl/00_intake/games

          Write-Host "Repo test inputs restored."

      - name: Commit permanent test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "docs/win/hockey/nhl/test_output/game_id_reconciliation/$env:TEST_DATE"

          if (git diff --cached --quiet) {
              Write-Host "No test output changes to commit."
              exit 0
          }

          git commit -m "test: NHL game ID reconciliation $env:TEST_DATE"
          git pull --rebase origin main
          git push

      - name: Print saved test output
        run: |
          $outputDir = "docs/win/hockey/nhl/test_output/game_id_reconciliation/$env:TEST_DATE"

          Write-Host "=== SUMMARY ==="
          Get-Content (Join-Path $outputDir "summary.txt")

          Write-Host ""
          Write-Host "=== OFFICIAL NHL SCHEDULE ==="
          Get-Content (Join-Path $outputDir "nhl_schedule.csv")

          Write-Host ""
          Write-Host "=== RECONCILED GAMES ==="
          Get-Content (Join-Path $outputDir "reconciled_games.csv")

          Write-Host ""
          Write-Host "=== RECONCILIATION AUDIT ==="
          Get-Content (Join-Path $outputDir "reconciliation_audit.csv")

          Write-Host ""
          Write-Host "=== GAMES OUTPUT ==="
          Get-Content (Join-Path $outputDir "games.csv")
