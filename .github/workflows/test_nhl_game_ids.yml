name: Test NHL Game ID Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  test-nhl-game-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Syntax check scripts
        run: |
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/transform_hockey_odds.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/transform_hockey.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/pull_nhl_schedule.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/reconcile_game_ids.py
          python -m py_compile docs/win/hockey/nhl/scripts/00_intake/build_games.py
          python -m py_compile docs/win/hockey/nhl/scripts/tests/test_game_id_reconciliation.py

      - name: Run fixture-only NHL game ID test
        run: |
          python docs/win/hockey/nhl/scripts/tests/test_game_id_reconciliation.py

      - name: Commit permanent test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/hockey/nhl/test_output/game_id_reconciliation/

          if (git diff --cached --quiet) {
              Write-Host "No test output changes to commit."
              exit 0
          }

          git commit -m "test: NHL fixture game ID reconciliation"
          git pull --rebase origin main
          git push

      - name: Print saved test output
        run: |
          $root = "docs/win/hockey/nhl/test_output/game_id_reconciliation"
          $summary = Get-ChildItem $root -Recurse -File -Filter "summary.txt" |
              Sort-Object FullName |
              Select-Object -Last 1

          if (-not $summary) {
              throw "Saved test summary not found."
          }

          Get-Content $summary.FullName
