name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: |
            --linter qodana-python
            --within-docker false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_960613749 }}
          QODANA_ENDPOINT: "https://qodana.cloud"
          QODANA_PYTHON_PATH: ${{ env.pythonLocation }}/bin/python