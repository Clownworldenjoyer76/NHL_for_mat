name: SDV NHL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdv-nhl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache SDV NHL xG models
        uses: actions/cache@v4
        with:
          path: ~/.cache/nhl_xg_models
          key: sdv-nhl-xg-models-v1

      - name: Pull SDV NHL data
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py

      - name: Commit SDV outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/hockey/nhl/sdv/

          git diff --cached --quiet || git commit -m "chore: update NHL SDV data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
