name: NHL Pipeline Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy pyyaml

      - name: Run NHL pipeline tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p docs/win/hockey/nhl/errors
          python -m pytest docs/win/hockey/nhl/scripts/tests/test_nhl_pipeline.py -v > docs/win/hockey/nhl/errors/nhl_pipeline_tests.txt 2>&1

      - name: Save test results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/hockey/nhl/errors/nhl_pipeline_tests.txt
          git diff --cached --quiet || git commit -m "Update NHL pipeline test results"
          git push

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
